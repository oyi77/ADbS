name: ADbS CI/CD

on:
  push:
    branches: [main, dev]
    tags:
      - v*
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-amd64
          - os: ubuntu-latest
            platform: linux-arm64
          - os: ubuntu-latest
            platform: linux-386
          - os: macos-latest
            platform: darwin-amd64
          - os: macos-latest
            platform: darwin-arm64
          - os: windows-latest
            platform: windows-amd64
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Build for ${{ matrix.platform }}
        run: |
          OS=$(echo ${{ matrix.platform }} | cut -d- -f1)
          ARCH=$(echo ${{ matrix.platform }} | cut -d- -f2)
          GOOS=$OS GOARCH=$ARCH go build -ldflags="-s -w" -o adbs-${{ matrix.platform }} ./cmd/adbs
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: adbs-${{ matrix.platform }}
          path: adbs-${{ matrix.platform }}
          
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
          
      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
          
      - name: Run tests
        run: go test ./...
